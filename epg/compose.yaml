services:
  epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: epg
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./channels.xml:/epg/public/channels.xml
    environment:
      - CRON_SCHEDULE=0 11 * * *
      - MAX_CONNECTIONS=2
      - DAYS=3
      - RUN_AT_STARTUP=true
    mem_limit: 2500m
    restart: unless-stopped
